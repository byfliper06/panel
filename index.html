<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruletas Interactivas</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            margin-bottom: 20px;
            color: #00e676;
        }

        .nav-buttons {
            margin-bottom: 30px;
        }

        .btn-nav {
            background-color: #1f1f1f;
            color: #fff;
            border: 2px solid #333;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 0 10px;
            border-radius: 25px;
            transition: all 0.3s ease;
        }

        .btn-nav.active {
            background-color: #00e676;
            color: #000;
            border-color: #00e676;
            box-shadow: 0 0 15px rgba(0, 230, 118, 0.4);
        }

        .roulette-container {
            display: none;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .roulette-container.active {
            display: flex;
        }

        /* Contenedor de la ruleta y la flecha */
        .canvas-wrapper {
            position: relative;
            margin-bottom: 25px;
        }

        /* Flecha indicadora superior */
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 30px solid #ff1744;
            z-index: 10;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.6));
        }

        canvas {
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.8), 0 0 5px rgba(255, 255, 255, 0.1);
            transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1);
        }

        .btn-spin {
            background-color: #ff1744;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 23, 68, 0.4);
            transition: transform 0.1s, background-color 0.3s;
        }

        .btn-spin:hover {
            background-color: #ff4569;
        }

        .btn-spin:active {
            transform: scale(0.95);
        }

        .result {
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
            min-height: 32px;
            color: #00e676;
            text-shadow: 0 0 10px rgba(0, 230, 118, 0.3);
        }
    </style>
</head>
<body>

    <h1>Panel de Ruletas</h1>

    <div class="nav-buttons">
        <button class="btn-nav active" onclick="switchRoulette('subs')">Ruleta Subs</button>
        <button class="btn-nav" onclick="switchRoulette('bits')">Ruleta Bits</button>
    </div>

    <div id="container-subs" class="roulette-container active">
        <div class="canvas-wrapper">
            <div class="pointer"></div>
            <canvas id="canvas-subs" width="450" height="450"></canvas>
        </div>
        <button class="btn-spin" onclick="spin('subs')">Girar Subs</button>
        <div id="result-subs" class="result"></div>
    </div>

    <div id="container-bits" class="roulette-container">
        <div class="canvas-wrapper">
            <div class="pointer"></div>
            <canvas id="canvas-bits" width="450" height="450"></canvas>
        </div>
        <button class="btn-spin" onclick="spin('bits')">Girar Bits</button>
        <div id="result-bits" class="result"></div>
    </div>

    <script>
        const config = {
            subs: {
                canvasId: 'canvas-subs',
                resultId: 'result-subs',
                totalSlices: 24,
                items: [],
                currentRotation: 0,
                isSpinning: false
            },
            bits: {
                canvasId: 'canvas-bits',
                resultId: 'result-bits',
                totalSlices: 50,
                items: [],
                currentRotation: 0,
                isSpinning: false
            }
        };

        const colors = ['#1e1b4b', '#311042', '#112240', '#0a3622', '#3d0a14', '#2d3748'];

        function initData() {
            // 1. Ruleta Subs
            const subsPool = [];
            while(subsPool.length < config.subs.totalSlices) {
                const block = Array.from({length: 11}, (_, i) => i + 2);
                block.sort(() => Math.random() - 0.5);
                subsPool.push(...block);
            }
            config.subs.items = subsPool.slice(0, config.subs.totalSlices);

            // 2. Ruleta Bits: 50 gajos totales, 40% (20 gajos) son 0 de forma fija
            const bitsPool = [];
            const totalBitsSlices = config.bits.totalSlices;
            const zeroSlicesCount = Math.floor(totalBitsSlices * 0.40); // 50 * 0.40 = 20 gajos

            // Insertar los 20 ceros fijados por el porcentaje
            for (let i = 0; i < zeroSlicesCount; i++) {
                bitsPool.push(0);
            }

            // Insertar los 30 gajos restantes distribuidos entre todas las cantidades hasta 4000
            const remainingSlices = totalBitsSlices - zeroSlicesCount;
            for (let i = 0; i < remainingSlices; i++) {
                // Rango ajustado: de 50 a 400 para multiplicar por 10 y obtener entre 500 y 4000
                const min = 50;
                const max = 400;
                const randomValue = (Math.floor(Math.random() * (max - min + 1)) + min) * 10;
                bitsPool.push(randomValue);
            }

            // Mezclar la lista completa aleatoriamente para distribuir los ceros e importes uniformemente
            bitsPool.sort(() => Math.random() - 0.5);
            config.bits.items = bitsPool;
        }

        function drawRoulette(type) {
            const cfg = config[type];
            const canvas = document.getElementById(cfg.canvasId);
            const ctx = canvas.getContext('2d');
            const size = canvas.width;
            const center = size / 2;
            const radius = center - 10;
            const sliceAngle = (2 * Math.PI) / cfg.totalSlices;

            ctx.clearRect(0, 0, size, size);

            cfg.items.forEach((text, index) => {
                const angle = index * sliceAngle;
                
                ctx.beginPath();
                ctx.fillStyle = colors[index % colors.length];
                ctx.moveTo(center, center);
                ctx.arc(center, center, radius, angle, angle + sliceAngle);
                ctx.lineTo(center, center);
                ctx.fill();
                
                ctx.strokeStyle = 'rgba(255,255,255,0.05)';
                ctx.lineWidth = 1;
                ctx.stroke();

                ctx.save();
                ctx.translate(center, center);
                ctx.rotate(angle + sliceAngle / 2);
                ctx.textAlign = "right";
                ctx.textBaseline = "middle";
                
                ctx.fillStyle = "#ffffff";
                ctx.font = cfg.totalSlices > 30 ? "bold 11px sans-serif" : "bold 14px sans-serif";
                
                ctx.fillText(text, radius - 15, 0);
                ctx.restore();
            });

            ctx.beginPath();
            ctx.arc(center, center, 25, 0, 2 * Math.PI);
            ctx.fillStyle = '#ffffff';
            ctx.shadowBlur = 10;
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(center, center, 18, 0, 2 * Math.PI);
            ctx.fillStyle = '#121212';
            ctx.fill();
        }

        function switchRoulette(type) {
            document.querySelectorAll('.btn-nav').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.roulette-container').forEach(cnt => cnt.classList.remove('active'));

            if (type === 'subs') {
                document.querySelectorAll('.btn-nav')[0].classList.add('active');
                document.getElementById('container-subs').classList.add('active');
            } else {
                document.querySelectorAll('.btn-nav')[1].classList.add('active');
                document.getElementById('container-bits').classList.add('active');
            }
        }

        function spin(type) {
            const cfg = config[type];
            if (cfg.isSpinning) return;

            cfg.isSpinning = true;
            document.getElementById(cfg.resultId).innerText = "¡Girando...!";

            const extraDegrees = Math.floor(Math.random() * 360);
            const totalSpins = 5 + Math.floor(Math.random() * 5);
            cfg.currentRotation += (totalSpins * 360) + extraDegrees;

            const canvas = document.getElementById(cfg.canvasId);
            canvas.style.transform = `rotate(${cfg.currentRotation}deg)`;

            setTimeout(() => {
                cfg.isSpinning = false;
                
                const degreesPerSlice = 360 / cfg.totalSlices;
                const actualModulo = cfg.currentRotation % 360;
                
                const targetAngle = (360 - actualModulo + 270) % 360;
                const winningIndex = Math.floor(targetAngle / degreesPerSlice) % cfg.totalSlices;
                const winnerValue = cfg.items[winningIndex];

                const label = type === 'subs' ? 'Subs' : 'Bits';
                document.getElementById(cfg.resultId).innerText = `¡Resultado: ${winnerValue} ${label}!`;
            }, 4000);
        }

        initData();
        drawRoulette('subs');
        drawRoulette('bits');
    </script>
</body>
</html>
